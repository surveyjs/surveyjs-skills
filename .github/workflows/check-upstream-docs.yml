name: Check upstream docs

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compare skills against surveyjs.io
        id: check
        shell: bash
        run: |
          set +e
          node scripts/check-upstream-docs.mjs | tee drift.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Create or update a review issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: SurveyJS docs changed — review skill reference files
        run: |
          issue_number=$(gh issue list \
            --state open \
            --search "\"$ISSUE_TITLE\" in:title" \
            --json number \
            --jq '.[0].number')

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body-file drift.txt
          else
            gh issue create --title "$ISSUE_TITLE" --body-file drift.txt
          fi

      - name: Fail when upstream docs could not be checked
        if: steps.check.outputs.status == '2'
        run: exit 1
