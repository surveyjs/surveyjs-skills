name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifests, skills, links, and snapshots
        run: node scripts/validate-repo.mjs

  cli:
    # Both platforms, because surveyjs-cli is mostly path handling and the two disagree:
    # a backslash separates directories on Windows and is a legal filename character on Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test surveyjs-cli
        run: node --test

      - name: Check the published tarball
        run: npm pack --dry-run
